server:
  port: 8077
  servlet:
    context-path: /tinyapp

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/tinylinks}
  jackson:
    time-zone: America/Sao_Paulo

resilience4j:
  ratelimiter:
    instances:
      readLimiter:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      writeLimiter:
        limitForPeriod: 3
        limitRefreshPeriod: 1s
        timeoutDuration: 0

tinylinks:
  quota:
    perUserPerDay: 200

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

logging:
  level:
    br.com.dev.tiny.service.urlshortener: INFO
    org.springframework.web: INFO
    org.springframework.data.mongodb: INFO
    io.github.resilience4j: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] [%X{userId}] [%X{operation}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] [%X{userId}] [%X{operation}] %logger{36} - %msg%n"

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,metrics,info,tracing

